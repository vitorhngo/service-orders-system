{% extends "base.html" %}
{% block content %}
    {% if user.is_authenticated %}
        <p>Você já está logado como {{ user.username }}</p>
        <a href="{% url 'sign-out' %}">Logout</a>
    {% else %}
        <form action="{% url 'sign-in' %}" method="post" class="form">
            {% csrf_token %}
            {{ form.as_p }}
            <button name="submit" class="btn btn-primary">Entrar</button>
            <input type="hidden" name="next" value="{% url 'profile' %}">  
        </form>
    {% endif %}
{% endblock content %}
